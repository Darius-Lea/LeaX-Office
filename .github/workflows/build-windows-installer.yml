name: Build verified Windows setup

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - public/**
      - scripts/build-production.mjs
      - scripts/build-native-installer.py
      - scripts/verify-installer.py
      - installer/**
      - .github/workflows/build-windows-installer.yml

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.24.x
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build and verify the installer
        run: python scripts/build-native-installer.py --go go
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version"
          if ($version -notmatch '^0\.2\.0-preview\.\d+$') { throw "Unexpected release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish setup as a versioned GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LeaX Office Pro ${{ steps.version.outputs.version }}
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            downloads/AI-Headquarters-Setup.exe
            downloads/AI-Headquarters-Setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
