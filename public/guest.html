<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>LeaX Guest Lobby</title><link rel="stylesheet" href="/embed.css"><link rel="stylesheet" href="/guest.css"><script src="/guest.js" defer></script></head><body><main><h1>LeaX Guest Lobby</h1><p id="status" role="status" aria-live="polite"></p><section id="join" hidden><form id="join-form"><label>Your name <input name="name" required maxlength="80" autocomplete="name"></label><button>Join guest lobby</button></form></section><section id="visitor" hidden><h2 id="welcome"></h2><p id="expiry"></p><p>This invitation gives access to this lobby only. Video meetings and office walkthroughs are not available yet.</p><button id="leave">Leave</button></section><section id="host" hidden><p>Create a one-person, passwordless guest lobby invitation. Guests cannot enter your private office or use your tools.</p><form id="create"><label>Office <select name="address" required></select></label><label>Expires in <select name="minutes"><option value="15">15 minutes</option><option value="60" selected>1 hour</option><option value="240">4 hours</option></select></label><button>Create guest link</button></form><p><input id="link" aria-label="Guest invitation link" readonly hidden><button id="copy" hidden>Copy link</button></p><div id="links"></div></section><p><a href="/offices">Shared office accounts</a></p></main></body></html>
